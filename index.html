<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Seguimiento de Alumnos - Mandala</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f9f9f9; }
        #login-container { display: flex; height: 100vh; justify-content: center; align-items: center; background-color: #fff; }
        .btn-google { display: flex; align-items: center; background-color: #fff; color: #3c4043; border: 1px solid #dadce0; border-radius: 4px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
        .btn-google:hover { background-color: #f8f9fa; box-shadow: 0 1px 3px 1px rgba(60,64,67,0.15); }
        .btn-google svg { width: 18px; height: 18px; margin-right: 8px; }
        #app-container { display: none; height: 100vh; width: 100%; }
        #sidebar { width: 250px; background: #f4f4f4; padding: 20px; border-right: 1px solid #ccc; }
        #main { flex-grow: 1; padding: 20px; overflow-y: auto; background-color: #fff; }
        .nav-item { cursor: pointer; padding: 10px; margin-bottom: 5px; background: #ddd; }
        .nav-item:hover { background: #ccc; }
        dialog { padding: 20px; border: 1px solid #ccc; border-radius: 5px; width: 80%; max-width: 600px; }
        .dia-disponibilidad { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .opcion-horario { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; }
        .opcion-horario button { margin-right: 5px; margin-top: 5px; }
        .alumno-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; background: #fff; }
        #header-auth { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        #user-info { font-weight: bold; }
        #btn-logout { cursor: pointer; padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 3px; }
        .abm-container { margin-bottom: 20px; }
        .abm-container input { padding: 8px; width: 200px; margin-right: 5px;}
        .abm-container button { padding: 8px 15px; cursor: pointer; }
        .abm-item { display: flex; justify-content: space-between; padding: 10px; border: 1px solid #ddd; margin-bottom: 5px; background: #fff; align-items: center; }
        .btn-eliminar { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="login-container">
        <button id="btn-login" class="btn-google">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            </svg>
            Iniciar sesión con Google
        </button>
    </div>

    <div id="app-container">
        <nav id="sidebar">
            <h3>Vistas</h3>
            <div class="nav-item" id="btn-gestion">Gestión en curso</div>
            <div class="nav-item" id="btn-confirmadas">Agenda confirmada</div>
            <div class="nav-item" id="btn-suspendidas">Agenda suspendida</div>
            <hr>
            <h3>Administración</h3>
            <div class="nav-item" id="btn-abm-profes">Profesores</div>
            <div class="nav-item" id="btn-abm-inst">Instrumentos</div>
            <div class="nav-item" id="btn-abm-susc">Suscripciones</div>
        </nav>
        <main id="main">
            <div id="header-auth">
                <div id="user-info">Cargando...</div>
                <button id="btn-logout">Cerrar Sesión</button>
            </div>
            <h2 id="vista-titulo">Gestión en curso</h2>
            <button id="btn-nuevo-alumno">Cargar Nuevo Alumno</button>
            <div id="lista-alumnos" style="margin-top: 20px;"></div>
        </main>
    </div>

    <dialog id="modal-alumno">
        <h3>Datos del Alumno</h3>
        <form id="form-alumno">
            <label>Nombre: <input type="text" id="nombre" required></label><br><br>
            <label>Celular: <input type="text" id="celular" required></label><br><br>
            <label>Edad: <input type="number" id="edad"></label><br><br>
            <label>Instrumento: <select id="instrumento" required><option value="">Cargando...</option></select></label><br><br>
            <label>Suscripción: <select id="tipo_suscripcion" required><option value="">Cargando...</option></select></label><br><br>
            <h4>Disponibilidad</h4>
            <div class="dia-disponibilidad"><label>Lunes:</label><input type="time" id="disp-L-inicio"> a <input type="time" id="disp-L-fin"></div>
            <div class="dia-disponibilidad"><label>Martes:</label><input type="time" id="disp-M-inicio"> a <input type="time" id="disp-M-fin"></div>
            <div class="dia-disponibilidad"><label>Miércoles:</label><input type="time" id="disp-X-inicio"> a <input type="time" id="disp-X-fin"></div>
            <div class="dia-disponibilidad"><label>Jueves:</label><input type="time" id="disp-J-inicio"> a <input type="time" id="disp-J-fin"></div>
            <div class="dia-disponibilidad"><label>Viernes:</label><input type="time" id="disp-V-inicio"> a <input type="time" id="disp-V-fin"></div>
            <div class="dia-disponibilidad"><label>Sábado:</label><input type="time" id="disp-S-inicio"> a <input type="time" id="disp-S-fin"></div>
            <br>
            <button type="submit">Guardar Alumno</button>
            <button type="button" id="btn-cerrar-alumno">Cancelar</button>
        </form>
    </dialog>

    <dialog id="modal-agenda">
        <h3>Agendas Disponibles</h3>
        <div id="resultados-agenda"></div>
        <br>
        <button type="button" id="btn-cerrar-agenda">Cerrar</button>
    </dialog>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgAg2EwTJh4zbMdpkqG3VKTGfDeofblyg",
            authDomain: "priel-mdl-seguimientos.firebaseapp.com",
            projectId: "priel-mdl-seguimientos",
            storageBucket: "priel-mdl-seguimientos.firebasestorage.app",
            messagingSenderId: "118730133451",
            appId: "1:118730133451:web:9e407e81a9b22ae9d0704e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/calendar.events');

        let googleAccessToken = null; // Token para Google APIs
        let alumnoIdActual = null;
        let estadoActualVista = 'Gestión en curso';

        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userInfo = document.getElementById('user-info');
        const btnNuevoAlumno = document.getElementById('btn-nuevo-alumno');
        const modalAlumno = document.getElementById('modal-alumno');
        const modalAgenda = document.getElementById('modal-agenda');
        const formAlumno = document.getElementById('form-alumno');
        const vistaTitulo = document.getElementById('vista-titulo');
        const listaAlumnos = document.getElementById('lista-alumnos');

        // --- FUNCIONES API GOOGLE CALENDAR ---
        async function getEventosCalendario(calendarId, timeMin, timeMax) {
            if (!googleAccessToken) throw new Error("Falta token. Vuelve a iniciar sesión.");
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true`;
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${googleAccessToken}` } });
            if (!res.ok) throw new Error("Error al leer calendario.");
            return await res.json();
        }

        async function crearEventoCalendario(calendarId, titulo, inicioStr, finStr) {
            if (!googleAccessToken) throw new Error("Falta token.");
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${googleAccessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    summary: titulo,
                    start: { dateTime: inicioStr, timeZone: 'America/Argentina/Buenos_Aires' },
                    end: { dateTime: finStr, timeZone: 'America/Argentina/Buenos_Aires' }
                })
            });
            if (!res.ok) throw new Error("Error al crear evento.");
            return await res.json();
        }

        async function actualizarEventoCalendario(calendarId, eventId, titulo) {
            if (!googleAccessToken) throw new Error("Falta token.");
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events/${eventId}`;
            const res = await fetch(url, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${googleAccessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ summary: titulo })
            });
            return await res.json();
        }

        function generarOpcionesAgenda(disponibilidadAlumno, eventosAPI, esBateria, idProfeRequerido) {
            // Lógica estructural del algoritmo (pendiente integrar fechas reales según la semana actual)
            const opcionesSugeridas = [];
            opcionesSugeridas.push({
                dia: "L", horaTexto: "18:00", huecoAlProfe: 0, inicioData: "2026-08-10T18:00:00-03:00", finData: "2026-08-10T19:00:00-03:00", profeCalId: idProfeRequerido
            });
            return opcionesSugeridas;
        }

        // --- AUTENTICACIÓN ---
        btnLogin.addEventListener('click', async () => {
            try { 
                const result = await signInWithPopup(auth, provider); 
                const credential = GoogleAuthProvider.credentialFromResult(result);
                googleAccessToken = credential.accessToken; // Guardamos el token
            } 
            catch (error) { alert("Error al iniciar sesión."); }
        });

        btnLogout.addEventListener('click', async () => { await signOut(auth); googleAccessToken = null; });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginContainer.style.display = 'none';
                appContainer.style.display = 'flex';
                userInfo.textContent = user.email;
                cargarVista('Gestión en curso'); 
            } else {
                loginContainer.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        // --- VISTAS ALUMNOS ---
        document.getElementById('btn-gestion').addEventListener('click', () => { if(auth.currentUser) cargarVista('Gestión en curso') });
        document.getElementById('btn-confirmadas').addEventListener('click', () => { if(auth.currentUser) cargarVista('Agenda confirmada') });
        document.getElementById('btn-suspendidas').addEventListener('click', () => { if(auth.currentUser) cargarVista('Agenda suspendida') });

        async function cargarVista(estado) {
            estadoActualVista = estado;
            vistaTitulo.textContent = estado;
            btnNuevoAlumno.style.display = 'inline-block';
            listaAlumnos.innerHTML = 'Cargando...';
            
            const q = query(collection(db, "alumnos"), where("estado_agenda", "==", estado));
            try {
                const querySnapshot = await getDocs(q);
                listaAlumnos.innerHTML = ''; 
                if (querySnapshot.empty) { listaAlumnos.innerHTML = '<p>No hay alumnos en este estado.</p>'; return; }

                querySnapshot.forEach((docSnap) => {
                    const alumno = docSnap.data();
                    const div = document.createElement('div');
                    div.className = 'alumno-item';
                    div.innerHTML = `
                        <strong>${alumno.nombre}</strong> - ${alumno.instrumento} (${alumno.tipo_suscripcion})<br>
                        Celular: ${alumno.celular}<br>
                        <button class="btn-abrir-agenda" data-id="${docSnap.id}">Buscar agenda disponible</button>
                    `;
                    listaAlumnos.appendChild(div);
                });

                document.querySelectorAll('.btn-abrir-agenda').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if(!googleAccessToken) { alert("Vuelve a iniciar sesión para conectar el calendario."); return; }
                        alumnoIdActual = e.target.getAttribute('data-id');
                        
                        // MOCK: Renderizado con los atributos listos para enviar a Calendar
                        const contenedorOpciones = document.getElementById('resultados-agenda');
                        contenedorOpciones.innerHTML = `
                            <div class="opcion-horario">
                                <span>Simulación - 18:00hs (Profe: primario)</span><br>
                                <button class="btn-reservar" data-calid="primary" data-start="2026-08-10T18:00:00-03:00" data-end="2026-08-10T19:00:00-03:00">Reservar</button>
                                <button class="btn-validar-profe" data-hora="Lunes 18:00hs">Validar con profe</button>
                                <button class="btn-validar-alumno" data-hora="Lunes 18:00hs">Validar con alumno</button>
                                <button class="btn-agendar" data-calid="primary" data-eventid="ID_MOCK">Agendar (Confirmar)</button>
                            </div>
                        `;
                        modalAgenda.showModal();
                    });
                });
            } catch (error) { listaAlumnos.innerHTML = '<p>Error al cargar los datos.</p>'; }
        }

        // --- VISTAS ABM ---
        document.getElementById('btn-abm-profes').addEventListener('click', () => { if(auth.currentUser) cargarABM('profesores', 'Profesores') });
        document.getElementById('btn-abm-inst').addEventListener('click', () => { if(auth.currentUser) cargarABM('instrumentos', 'Instrumentos') });
        document.getElementById('btn-abm-susc').addEventListener('click', () => { if(auth.currentUser) cargarABM('tipos_suscripcion', 'Suscripciones') });

        async function cargarABM(coleccion, titulo) {
            vistaTitulo.textContent = 'Administración: ' + titulo;
            btnNuevoAlumno.style.display = 'none';
            listaAlumnos.innerHTML = 'Cargando...';

            try {
                const querySnapshot = await getDocs(collection(db, coleccion));
                let html = `<div class="abm-container">
                    <input type="text" id="input-nuevo-abm" placeholder="Nombre">`;
                
                if (coleccion === 'profesores') {
                    html += `<input type="email" id="input-correo-abm" placeholder="Email Calendario">`;
                }
                
                html += `<button id="btn-guardar-abm">Agregar</button></div><div id="lista-items-abm">`;
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const correoTxt = data.correo_calendario ? ` (${data.correo_calendario})` : '';
                    html += `
                        <div class="abm-item">
                            <span>${data.nombre}${correoTxt}</span>
                            <button class="btn-eliminar" data-id="${docSnap.id}">Eliminar</button>
                        </div>`;
                });
                html += '</div>';
                listaAlumnos.innerHTML = html;

                document.getElementById('btn-guardar-abm').addEventListener('click', async () => {
                    const nombre = document.getElementById('input-nuevo-abm').value.trim();
                    if (!nombre) return;
                    const dataObj = { nombre: nombre };
                    if (coleccion === 'profesores') {
                        const correo = document.getElementById('input-correo-abm').value.trim();
                        if (correo) dataObj.correo_calendario = correo;
                    }
                    await addDoc(collection(db, coleccion), dataObj);
                    cargarABM(coleccion, titulo);
                });

                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        await deleteDoc(doc(db, coleccion, e.target.getAttribute('data-id')));
                        cargarABM(coleccion, titulo);
                    });
                });
            } catch (error) { listaAlumnos.innerHTML = '<p>Error.</p>'; }
        }

        // --- FORMULARIO ALUMNOS ---
        async function cargarSelectsFormulario() {
            const selectInst = document.getElementById('instrumento');
            const selectSusc = document.getElementById('tipo_suscripcion');
            selectInst.innerHTML = '<option value="">Seleccione...</option>';
            selectSusc.innerHTML = '<option value="">Seleccione...</option>';
            const instSnap = await getDocs(collection(db, "instrumentos"));
            instSnap.forEach(d => { selectInst.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; });
            const suscSnap = await getDocs(collection(db, "tipos_suscripcion"));
            suscSnap.forEach(d => { selectSusc.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; });
        }

        btnNuevoAlumno.addEventListener('click', async () => { await cargarSelectsFormulario(); modalAlumno.showModal(); });
        document.getElementById('btn-cerrar-alumno').addEventListener('click', () => { modalAlumno.close(); formAlumno.reset(); });
        document.getElementById('btn-cerrar-agenda').addEventListener('click', () => modalAgenda.close());

        formAlumno.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nuevoAlumno = {
                nombre: document.getElementById('nombre').value,
                celular: document.getElementById('celular').value,
                edad: Number(document.getElementById('edad').value),
                instrumento: document.getElementById('instrumento').value,
                tipo_suscripcion: document.getElementById('tipo_suscripcion').value,
                estado_agenda: "Gestión en curso",
                disponibilidad: {
                    L: [{ inicio: document.getElementById('disp-L-inicio').value, fin: document.getElementById('disp-L-fin').value }],
                    M: [{ inicio: document.getElementById('disp-M-inicio').value, fin: document.getElementById('disp-M-fin').value }],
                    X: [{ inicio: document.getElementById('disp-X-inicio').value, fin: document.getElementById('disp-X-fin').value }],
                    J: [{ inicio: document.getElementById('disp-J-inicio').value, fin: document.getElementById('disp-J-fin').value }],
                    V: [{ inicio: document.getElementById('disp-V-inicio').value, fin: document.getElementById('disp-V-fin').value }],
                    S: [{ inicio: document.getElementById('disp-S-inicio').value, fin: document.getElementById('disp-S-fin').value }]
                }
            };
            try { await addDoc(collection(db, "alumnos"), nuevoAlumno); modalAlumno.close(); formAlumno.reset(); cargarVista(estadoActualVista); } 
            catch (error) { alert("Error al guardar."); }
        });

        // --- INTERACCIONES DE AGENDA ---
        document.getElementById('resultados-agenda').addEventListener('click', async (e) => {
            if (!alumnoIdActual) return;
            const docRef = doc(db, "alumnos", alumnoIdActual);

            try {
                if (e.target.classList.contains('btn-validar-profe')) {
                    const horaTxt = e.target.getAttribute('data-hora');
                    await navigator.clipboard.writeText(`Hola, ¿podés tomar una clase de admisión el ${horaTxt}?`);
                    await updateDoc(docRef, { estado_agenda: "Validación con profe" });
                    modalAgenda.close(); cargarVista(estadoActualVista);
                }
                if (e.target.classList.contains('btn-validar-alumno')) {
                    const horaTxt = e.target.getAttribute('data-hora');
                    await navigator.clipboard.writeText(`Hola, tenemos disponibilidad para tu clase de prueba el ${horaTxt}. ¿Te sirve este horario?`);
                    await updateDoc(docRef, { estado_agenda: "Se ofrece agenda" });
                    modalAgenda.close(); cargarVista(estadoActualVista);
                }
                
                // INTEGRACIÓN REAL CALENDAR
                if (e.target.classList.contains('btn-reservar')) {
                    const calId = e.target.getAttribute('data-calid');
                    const start = e.target.getAttribute('data-start');
                    const end = e.target.getAttribute('data-end');
                    const titulo = `RESERVA - Alumno ${alumnoIdActual}`;
                    
                    const eventoObj = await crearEventoCalendario(calId, titulo, start, end);
                    await updateDoc(docRef, { id_evento_reserva: eventoObj.id, id_calendario_usado: calId });
                    alert("Reserva registrada en Google Calendar.");
                    modalAgenda.close(); cargarVista(estadoActualVista);
                }
                
                if (e.target.classList.contains('btn-agendar')) {
                    // Aquí se usaría el ID real guardado en la base de datos y la función actualizarEventoCalendario()
                    await updateDoc(docRef, { estado_agenda: "Agenda confirmada" });
                    modalAgenda.close(); cargarVista('Agenda confirmada'); 
                }
            } catch (error) { 
                console.error(error);
                alert("Error en la base de datos o en Calendar."); 
            }
        });
    </script>
</body>
</html>
