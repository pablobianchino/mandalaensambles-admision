<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Seguimiento de Alumnos - Mandala</title>
    
    <!-- Quill.js CSS para el editor de texto enriquecido -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f9f9f9; }
        #login-container { display: flex; height: 100vh; justify-content: center; align-items: center; background-color: #fff; }
        .btn-google { display: flex; align-items: center; background-color: #fff; color: #3c4043; border: 1px solid #dadce0; border-radius: 4px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3); }
        .btn-google:hover { background-color: #f8f9fa; box-shadow: 0 1px 3px 1px rgba(60,64,67,0.15); }
        .btn-google svg { width: 18px; height: 18px; margin-right: 8px; }
        
        #app-container { display: none; height: 100vh; width: 100%; }
        #sidebar { width: 250px; background: #f4f4f4; padding: 20px; border-right: 1px solid #ccc; }
        #main { flex-grow: 1; padding: 20px; overflow-y: auto; background-color: #fff; }
        .nav-item { cursor: pointer; padding: 10px; margin-bottom: 5px; background: #ddd; }
        .nav-item:hover { background: #ccc; }
        
        dialog { padding: 20px; border: 1px solid #ccc; border-radius: 5px; width: 85%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
        .dia-disponibilidad { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .dia-disponibilidad label { width: 80px; font-weight: bold; }
        .estado-disp { font-weight: bold; font-size: 0.9em; margin-left: 10px; }
        
        .opcion-horario { margin-bottom: 15px; padding: 10px; border: 1px solid #eee; background: #fff; }
        .opcion-horario button { margin-right: 5px; margin-top: 5px; cursor: pointer; padding: 5px 10px; }
        .alumno-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; background: #fff; display: flex; justify-content: space-between; align-items: center; }
        
        #header-auth { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        #user-info { font-weight: bold; }
        #btn-logout { cursor: pointer; padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 3px; }
        
        .abm-container { margin-bottom: 20px; }
        .abm-container input { padding: 8px; width: 200px; margin-right: 5px;}
        .abm-container button { padding: 8px 15px; cursor: pointer; }
        .abm-item { display: flex; justify-content: space-between; padding: 10px; border: 1px solid #ddd; margin-bottom: 5px; background: #fff; align-items: center; }
        .btn-acciones button { padding: 5px 10px; margin-left: 5px; cursor: pointer; border: none; border-radius: 3px; color: white; }
        .btn-eliminar { background: #dc3545; }
        .btn-editar { background: #ffc107; color: black !important; }
        
        /* Contenedor del editor Quill */
        #editor-container { height: 150px; margin-bottom: 20px; background: white; }
    </style>
</head>
<body>
    <!-- Pantalla Login -->
    <div id="login-container">
        <button id="btn-login" class="btn-google">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
            </svg>
            Iniciar sesión con Google
        </button>
    </div>

    <!-- App Main -->
    <div id="app-container">
        <nav id="sidebar">
            <h3>Vistas</h3>
            <div class="nav-item" id="btn-gestion">Gestión en curso</div>
            <div class="nav-item" id="btn-confirmadas">Agenda confirmada</div>
            <div class="nav-item" id="btn-suspendidas">Agenda suspendida</div>
            <hr>
            <h3>Administración</h3>
            <div class="nav-item" id="btn-abm-profes">Profesores</div>
            <div class="nav-item" id="btn-abm-inst">Instrumentos</div>
            <div class="nav-item" id="btn-abm-susc">Suscripciones</div>
        </nav>
        <main id="main">
            <div id="header-auth">
                <div id="user-info">Cargando...</div>
                <button id="btn-logout">Cerrar Sesión</button>
            </div>
            <h2 id="vista-titulo">Gestión en curso</h2>
            <button id="btn-nuevo-alumno">Cargar Nuevo Alumno</button>
            <div id="lista-alumnos" style="margin-top: 20px;"></div>
        </main>
    </div>

    <!-- Modal Formulario Alumnos -->
    <dialog id="modal-alumno">
        <h3 id="modal-alumno-titulo">Datos del Alumno</h3>
        <form id="form-alumno">
            <input type="hidden" id="alumno-id">
            
            <label>Nombre: <input type="text" id="nombre" required></label><br><br>
            <label>Celular: <input type="text" id="celular" required></label><br><br>
            <label>Edad: <input type="number" id="edad"></label><br><br>
            <label>Instrumento: <select id="instrumento" required><option value="">Cargando...</option></select></label><br><br>
            <label>Suscripción: <select id="tipo_suscripcion" required><option value="">Cargando...</option></select></label><br><br>
            
            <h4>Descripción del Alumno</h4>
            <div id="editor-container"></div>
            <br>
            
            <h4>Disponibilidad</h4>
            <!-- Generado dinámicamente por JS para asegurar IDs -->
            <div id="contenedor-disponibilidad"></div>
            
            <br>
            <button type="submit">Guardar Alumno</button>
            <button type="button" id="btn-cerrar-alumno">Cancelar</button>
        </form>
    </dialog>

    <!-- Modal Buscador de Agenda -->
    <dialog id="modal-agenda">
        <h3>Buscar Agenda</h3>
        <div style="margin-bottom: 15px; padding: 10px; background: #f4f4f4; border-radius: 5px;">
            <label>Desde: <input type="date" id="agenda-start"></label>
            <label style="margin-left: 15px;">Hasta: <input type="date" id="agenda-end"></label>
            <button id="btn-ejecutar-busqueda" style="margin-left: 15px; cursor:pointer;">Buscar en Calendar</button>
        </div>
        <div id="resultados-agenda">
            <p>Selecciona las fechas y haz clic en Buscar.</p>
        </div>
        <br>
        <button type="button" id="btn-cerrar-agenda">Cerrar</button>
    </dialog>

    <!-- Modal Edición ABM -->
    <dialog id="modal-abm-edit">
        <h3>Editar Registro</h3>
        <input type="hidden" id="abm-edit-id">
        <input type="hidden" id="abm-edit-coleccion">
        <label>Nombre: <input type="text" id="abm-edit-nombre"></label><br><br>
        <label id="lbl-abm-edit-correo" style="display:none;">Email Calendario: <input type="email" id="abm-edit-correo"></label><br><br>
        <button id="btn-guardar-abm-edit">Actualizar</button>
        <button type="button" id="btn-cerrar-abm-edit">Cancelar</button>
    </dialog>

    <!-- Quill.js Librería -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- Lógica de la Aplicación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, updateDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgAg2EwTJh4zbMdpkqG3VKTGfDeofblyg",
            authDomain: "priel-mdl-seguimientos.firebaseapp.com",
            projectId: "priel-mdl-seguimientos",
            storageBucket: "priel-mdl-seguimientos.firebasestorage.app",
            messagingSenderId: "118730133451",
            appId: "1:118730133451:web:9e407e81a9b22ae9d0704e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/calendar.events');

        let googleAccessToken = null; 
        let alumnoIdActual = null;
        let estadoActualVista = 'Gestión en curso';
        let tituloABMActual = '';

        // Inicialización del Editor Quill
        const quill = new Quill('#editor-container', {
            theme: 'snow',
            modules: { toolbar: [ ['bold', 'italic', 'underline'], [{ 'size': ['small', false, 'large', 'huge'] }], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['clean'] ] }
        });

        // --- RENDERIZADO UI DISPONIBILIDAD ---
        const diasSemana = [
            { id: 'L', nombre: 'Lunes' }, { id: 'M', nombre: 'Martes' }, { id: 'X', nombre: 'Miércoles' },
            { id: 'J', nombre: 'Jueves' }, { id: 'V', nombre: 'Viernes' }, { id: 'S', nombre: 'Sábado' }
        ];
        const contDisp = document.getElementById('contenedor-disponibilidad');
        
        diasSemana.forEach(dia => {
            contDisp.innerHTML += `
                <div class="dia-disponibilidad">
                    <label>${dia.nombre}:</label>
                    <input type="time" id="disp-${dia.id}-inicio"> a <input type="time" id="disp-${dia.id}-fin">
                    <label style="font-weight:normal; width:auto; margin-left:10px;"><input type="checkbox" id="disp-${dia.id}-all"> Todo el día</label>
                    <label style="font-weight:normal; width:auto; margin-left:10px;"><input type="checkbox" id="disp-${dia.id}-none"> No disp.</label>
                    <span id="estado-${dia.id}" class="estado-disp"></span>
                </div>
            `;
        });

        // Lógica visual de los checkboxes
        diasSemana.forEach(dia => {
            const chkAll = document.getElementById(`disp-${dia.id}-all`);
            const chkNone = document.getElementById(`disp-${dia.id}-none`);
            const tIni = document.getElementById(`disp-${dia.id}-inicio`);
            const tFin = document.getElementById(`disp-${dia.id}-fin`);
            const spanE = document.getElementById(`estado-${dia.id}`);

            function updateDispState(source) {
                if (source === 'all' && chkAll.checked) {
                    chkNone.checked = false;
                    tIni.disabled = true; tFin.disabled = true;
                    tIni.value = ''; tFin.value = '';
                    spanE.textContent = "Disponible todo el día"; spanE.style.color = "green";
                } else if (source === 'none' && chkNone.checked) {
                    chkAll.checked = false;
                    tIni.disabled = true; tFin.disabled = true;
                    tIni.value = ''; tFin.value = '';
                    spanE.textContent = "No disponible"; spanE.style.color = "red";
                } else {
                    tIni.disabled = false; tFin.disabled = false;
                    spanE.textContent = "";
                }
            }
            chkAll.addEventListener('change', () => updateDispState('all'));
            chkNone.addEventListener('change', () => updateDispState('none'));
        });

        // --- FUNCIONES UTILITARIAS Y API CALENDAR ---
        function formatoLocalISO(date) {
            const tzo = -date.getTimezoneOffset(), dif = tzo >= 0 ? '+' : '-', pad = num => (num < 10 ? '0' : '') + num;
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds()) + dif + pad(Math.floor(Math.abs(tzo) / 60)) + ':' + pad(Math.abs(tzo) % 60);
        }

        async function getEventosCalendario(calendarId, timeMin, timeMax) {
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true`;
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${googleAccessToken}` } });
            if (!res.ok) throw new Error("Error leyendo calendario");
            return await res.json();
        }

        async function crearEventoCalendario(calendarId, titulo, inicioStr, finStr) {
            const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${googleAccessToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ summary: titulo, start: { dateTime: inicioStr }, end: { dateTime: finStr } })
            });
            if (!res.ok) throw new Error("Error creando evento");
            return await res.json();
        }

        function generarOpcionesAgenda(disponibilidadAlumno, eventosAPI, esBateria, profesores, dStart, dEnd) {
            const opciones = [];
            const mapaDias = { 0: "D", 1: "L", 2: "M", 3: "X", 4: "J", 5: "V", 6: "S" };
            const duracionMs = 60 * 60 * 1000; 

            // Calculamos la diferencia en días para el bucle
            const diffTime = Math.abs(dEnd - dStart);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            for (let i = 0; i <= diffDays; i++) {
                const fechaEval = new Date(dStart);
                fechaEval.setDate(fechaEval.getDate() + i);
                const letraDia = mapaDias[fechaEval.getDay()];

                if (disponibilidadAlumno[letraDia] && disponibilidadAlumno[letraDia].length > 0) {
                    disponibilidadAlumno[letraDia].forEach(rango => {
                        if (!rango.inicio || !rango.fin) return;
                        
                        const [hIni, mIni] = rango.inicio.split(':');
                        const [hFin, mFin] = rango.fin.split(':');
                        
                        const horaInicioBloque = new Date(fechaEval);
                        horaInicioBloque.setHours(parseInt(hIni), parseInt(mIni), 0, 0);
                        
                        const horaFinRango = new Date(fechaEval);
                        horaFinRango.setHours(parseInt(hFin), parseInt(mFin), 0, 0);

                        if (horaInicioBloque < new Date()) {
                            horaInicioBloque.setHours(new Date().getHours() + 1, 0, 0, 0);
                        }

                        while (horaInicioBloque.getTime() + duracionMs <= horaFinRango.getTime()) {
                            const inicioMs = horaInicioBloque.getTime();
                            const finMs = inicioMs + duracionMs;

                            let eventosSimultaneos = 0;
                            let bateriasSimultaneas = 0;
                            let profesoresOcupados = new Set();

                            eventosAPI.forEach(ev => {
                                if (!ev.start || !ev.start.dateTime) return;
                                const evInicio = new Date(ev.start.dateTime).getTime();
                                const evFin = new Date(ev.end.dateTime).getTime();
                                if (inicioMs < evFin && finMs > evInicio) {
                                    eventosSimultaneos++;
                                    profesoresOcupados.add(ev.profeId);
                                    if (ev.summary && ev.summary.includes('🥁')) bateriasSimultaneas++;
                                }
                            });

                            if (eventosSimultaneos < 3 && (esBateria ? bateriasSimultaneas < 2 : true)) {
                                profesores.forEach(profe => {
                                    if (!profesoresOcupados.has(profe.id)) {
                                        opciones.push({
                                            fechaTexto: fechaEval.toLocaleDateString('es-AR'),
                                            horaTexto: horaInicioBloque.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'}),
                                            profeNombre: profe.nombre,
                                            calId: profe.calId,
                                            inicioData: formatoLocalISO(horaInicioBloque),
                                            finData: formatoLocalISO(new Date(finMs))
                                        });
                                    }
                                });
                            }
                            horaInicioBloque.setHours(horaInicioBloque.getHours() + 1);
                        }
                    });
                }
            }
            return opciones;
        }

        // --- AUTENTICACIÓN ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            try { 
                const result = await signInWithPopup(auth, provider); 
                googleAccessToken = GoogleAuthProvider.credentialFromResult(result).accessToken;
            } catch (error) { alert("Error al iniciar sesión."); }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => { await signOut(auth); googleAccessToken = null; });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('user-info').textContent = user.email;
                cargarVista('Gestión en curso'); 
            } else {
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        // --- VISTAS ALUMNOS ---
        document.getElementById('btn-gestion').addEventListener('click', () => { if(auth.currentUser) cargarVista('Gestión en curso') });
        document.getElementById('btn-confirmadas').addEventListener('click', () => { if(auth.currentUser) cargarVista('Agenda confirmada') });
        document.getElementById('btn-suspendidas').addEventListener('click', () => { if(auth.currentUser) cargarVista('Agenda suspendida') });

        async function cargarVista(estado) {
            estadoActualVista = estado;
            document.getElementById('vista-titulo').textContent = estado;
            document.getElementById('btn-nuevo-alumno').style.display = 'inline-block';
            const listaAlumnos = document.getElementById('lista-alumnos');
            listaAlumnos.innerHTML = 'Cargando...';
            
            try {
                const querySnapshot = await getDocs(query(collection(db, "alumnos"), where("estado_agenda", "==", estado)));
                listaAlumnos.innerHTML = ''; 
                if (querySnapshot.empty) { listaAlumnos.innerHTML = '<p>No hay alumnos en este estado.</p>'; return; }

                querySnapshot.forEach((docSnap) => {
                    const al = docSnap.data();
                    listaAlumnos.innerHTML += `
                        <div class="alumno-item">
                            <div>
                                <strong>${al.nombre}</strong> - ${al.instrumento} (${al.tipo_suscripcion})<br>
                                Celular: ${al.celular}
                            </div>
                            <div class="btn-acciones">
                                <button class="btn-abrir-agenda" data-id="${docSnap.id}" style="background:#28a745;">Agenda</button>
                                <button class="btn-editar-alumno btn-editar" data-id="${docSnap.id}">Editar</button>
                                <button class="btn-eliminar-alumno btn-eliminar" data-id="${docSnap.id}">Eliminar</button>
                            </div>
                        </div>
                    `;
                });

                // Asignar eventos Agenda
                document.querySelectorAll('.btn-abrir-agenda').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if(!googleAccessToken) { alert("Requiere token. Inicia sesión nuevamente."); return; }
                        alumnoIdActual = e.target.getAttribute('data-id');
                        
                        // Setear fechas por defecto en selectores
                        const hoy = new Date();
                        document.getElementById('agenda-start').value = hoy.toISOString().split('T')[0];
                        const s7 = new Date(hoy); s7.setDate(s7.getDate() + 7);
                        document.getElementById('agenda-end').value = s7.toISOString().split('T')[0];
                        document.getElementById('resultados-agenda').innerHTML = '<p>Selecciona las fechas y haz clic en Buscar.</p>';
                        
                        document.getElementById('modal-agenda').showModal();
                    });
                });

                // Asignar eventos Editar Alumno
                document.querySelectorAll('.btn-editar-alumno').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        const docAl = await getDoc(doc(db, "alumnos", id));
                        const data = docAl.data();
                        
                        document.getElementById('modal-alumno-titulo').textContent = 'Editar Alumno';
                        document.getElementById('alumno-id').value = id;
                        document.getElementById('nombre').value = data.nombre;
                        document.getElementById('celular').value = data.celular;
                        document.getElementById('edad').value = data.edad;
                        
                        await cargarSelectsFormulario();
                        document.getElementById('instrumento').value = data.instrumento;
                        document.getElementById('tipo_suscripcion').value = data.tipo_suscripcion;
                        quill.root.innerHTML = data.descripcion || '';
                        
                        // Cargar disponibilidad visual
                        diasSemana.forEach(dia => {
                            const dData = data.disponibilidad[dia.id];
                            const tIni = document.getElementById(`disp-${dia.id}-inicio`);
                            const tFin = document.getElementById(`disp-${dia.id}-fin`);
                            const chkAll = document.getElementById(`disp-${dia.id}-all`);
                            const chkNone = document.getElementById(`disp-${dia.id}-none`);
                            const spanE = document.getElementById(`estado-${dia.id}`);
                            
                            // Reset state
                            tIni.disabled = false; tFin.disabled = false; chkAll.checked = false; chkNone.checked = false; spanE.textContent = "";
                            
                            if (!dData || dData.length === 0) {
                                chkNone.checked = true;
                                tIni.disabled = true; tFin.disabled = true;
                                tIni.value = ''; tFin.value = '';
                                spanE.textContent = "No disponible"; spanE.style.color = "red";
                            } else if (dData[0].inicio === '09:00' && dData[0].fin === '22:00') {
                                chkAll.checked = true;
                                tIni.disabled = true; tFin.disabled = true;
                                tIni.value = ''; tFin.value = '';
                                spanE.textContent = "Disponible todo el día"; spanE.style.color = "green";
                            } else {
                                tIni.value = dData[0].inicio;
                                tFin.value = dData[0].fin;
                            }
                        });
                        
                        document.getElementById('modal-alumno').showModal();
                    });
                });

                // Asignar eventos Eliminar Alumno
                document.querySelectorAll('.btn-eliminar-alumno').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if(confirm("¿Eliminar alumno?")) {
                            await deleteDoc(doc(db, "alumnos", e.target.getAttribute('data-id')));
                            cargarVista(estadoActualVista);
                        }
                    });
                });

            } catch (error) { console.error(error); }
        }

        // --- BUSQUEDA AGENDA EJECUCIÓN ---
        document.getElementById('btn-ejecutar-busqueda').addEventListener('click', async () => {
            const dStrStart = document.getElementById('agenda-start').value;
            const dStrEnd = document.getElementById('agenda-end').value;
            if(!dStrStart || !dStrEnd) return alert("Selecciona inicio y fin.");
            
            const resDiv = document.getElementById('resultados-agenda');
            resDiv.innerHTML = '<p>Cruzando datos con Google Calendar...</p>';

            try {
                const alumnoDoc = await getDoc(doc(db, "alumnos", alumnoIdActual));
                const alumno = alumnoDoc.data();
                const esBateria = alumno.instrumento.toLowerCase().includes('bater');

                const profesSnap = await getDocs(collection(db, "profesores"));
                const profesores = [];
                profesSnap.forEach(p => { if(p.data().correo_calendario) profesores.push({ id: p.id, nombre: p.data().nombre, calId: p.data().correo_calendario }); });
                if (profesores.length === 0) { resDiv.innerHTML = '<p>No hay profesores con calendario.</p>'; return; }

                const dStart = new Date(dStrStart + 'T00:00:00');
                const dEnd = new Date(dStrEnd + 'T23:59:59');
                
                let todosLosEventos = [];
                for (const profe of profesores) {
                    try {
                        const data = await getEventosCalendario(profe.calId, dStart.toISOString(), dEnd.toISOString());
                        if(data.items) todosLosEventos = todosLosEventos.concat(data.items.map(ev => ({ ...ev, profeId: profe.id })));
                    } catch(err) { console.error(err); }
                }

                const opciones = generarOpcionesAgenda(alumno.disponibilidad, todosLosEventos, esBateria, profesores, dStart, dEnd);

                if (opciones.length === 0) resDiv.innerHTML = '<p>No se encontraron horarios libres.</p>';
                else {
                    resDiv.innerHTML = opciones.map(op => `
                        <div class="opcion-horario">
                            <span>${op.fechaTexto} a las ${op.horaTexto} (Profe: ${op.profeNombre})</span><br>
                            <button class="btn-reservar" data-calid="${op.calId}" data-start="${op.inicioData}" data-end="${op.finData}">Reservar horario</button>
                            <button class="btn-validar-profe" data-hora="${op.fechaTexto} a las ${op.horaTexto}">Validar con profe</button>
                            <button class="btn-validar-alumno" data-hora="${op.fechaTexto} a las ${op.horaTexto}">Validar con alumno</button>
                        </div>
                    `).join('');
                }
            } catch (error) { resDiv.innerHTML = '<p>Error al ejecutar el algoritmo.</p>'; }
        });

        // --- VISTAS ABM ---
        document.getElementById('btn-abm-profes').addEventListener('click', () => { if(auth.currentUser) cargarABM('profesores', 'Profesores') });
        document.getElementById('btn-abm-inst').addEventListener('click', () => { if(auth.currentUser) cargarABM('instrumentos', 'Instrumentos') });
        document.getElementById('btn-abm-susc').addEventListener('click', () => { if(auth.currentUser) cargarABM('tipos_suscripcion', 'Suscripciones') });

        async function cargarABM(coleccion, titulo) {
            tituloABMActual = titulo;
            document.getElementById('vista-titulo').textContent = 'Administración: ' + titulo;
            document.getElementById('btn-nuevo-alumno').style.display = 'none';
            const listaAlumnos = document.getElementById('lista-alumnos');
            
            try {
                const querySnapshot = await getDocs(collection(db, coleccion));
                let html = `<div class="abm-container"><input type="text" id="input-nuevo-abm" placeholder="Nombre">`;
                if (coleccion === 'profesores') html += `<input type="email" id="input-correo-abm" placeholder="Email Calendario">`;
                html += `<button id="btn-guardar-abm">Agregar</button></div><div id="lista-items-abm">`;
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const correoTxt = data.correo_calendario ? ` (${data.correo_calendario})` : '';
                    html += `
                        <div class="abm-item">
                            <span>${data.nombre}${correoTxt}</span>
                            <div class="btn-acciones">
                                <button class="btn-editar-abm btn-editar" data-id="${docSnap.id}" data-coleccion="${coleccion}" data-nombre="${data.nombre}" data-correo="${data.correo_calendario || ''}">Editar</button>
                                <button class="btn-eliminar-abm btn-eliminar" data-id="${docSnap.id}" data-coleccion="${coleccion}">Eliminar</button>
                            </div>
                        </div>`;
                });
                html += '</div>';
                listaAlumnos.innerHTML = html;

                document.getElementById('btn-guardar-abm').addEventListener('click', async () => {
                    const nombre = document.getElementById('input-nuevo-abm').value.trim();
                    if (!nombre) return;
                    const dataObj = { nombre: nombre };
                    if (coleccion === 'profesores') {
                        const correo = document.getElementById('input-correo-abm').value.trim();
                        if (correo) dataObj.correo_calendario = correo;
                    }
                    await addDoc(collection(db, coleccion), dataObj);
                    cargarABM(coleccion, titulo);
                });

                document.querySelectorAll('.btn-eliminar-abm').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        await deleteDoc(doc(db, e.target.getAttribute('data-coleccion'), e.target.getAttribute('data-id')));
                        cargarABM(coleccion, titulo);
                    });
                });

                document.querySelectorAll('.btn-editar-abm').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const col = e.target.getAttribute('data-coleccion');
                        document.getElementById('abm-edit-id').value = e.target.getAttribute('data-id');
                        document.getElementById('abm-edit-coleccion').value = col;
                        document.getElementById('abm-edit-nombre').value = e.target.getAttribute('data-nombre');
                        
                        if (col === 'profesores') {
                            document.getElementById('lbl-abm-edit-correo').style.display = 'inline-block';
                            document.getElementById('abm-edit-correo').value = e.target.getAttribute('data-correo');
                        } else {
                            document.getElementById('lbl-abm-edit-correo').style.display = 'none';
                        }
                        document.getElementById('modal-abm-edit').showModal();
                    });
                });
            } catch (error) { console.error(error); }
        }

        // --- EDICIÓN ABM ---
        document.getElementById('btn-guardar-abm-edit').addEventListener('click', async () => {
            const id = document.getElementById('abm-edit-id').value;
            const coleccion = document.getElementById('abm-edit-coleccion').value;
            const dataObj = { nombre: document.getElementById('abm-edit-nombre').value };
            if (coleccion === 'profesores') dataObj.correo_calendario = document.getElementById('abm-edit-correo').value;
            
            await updateDoc(doc(db, coleccion, id), dataObj);
            document.getElementById('modal-abm-edit').close();
            cargarABM(coleccion, tituloABMActual);
        });
        document.getElementById('btn-cerrar-abm-edit').addEventListener('click', () => document.getElementById('modal-abm-edit').close());

        // --- FORMULARIO ALUMNOS (ALTA Y EDICIÓN) ---
        async function cargarSelectsFormulario() {
            const selectInst = document.getElementById('instrumento');
            const selectSusc = document.getElementById('tipo_suscripcion');
            selectInst.innerHTML = '<option value="">Seleccione...</option>';
            selectSusc.innerHTML = '<option value="">Seleccione...</option>';
            const instSnap = await getDocs(collection(db, "instrumentos"));
            instSnap.forEach(d => { selectInst.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; });
            const suscSnap = await getDocs(collection(db, "tipos_suscripcion"));
            suscSnap.forEach(d => { selectSusc.innerHTML += `<option value="${d.data().nombre}">${d.data().nombre}</option>`; });
        }

        document.getElementById('btn-nuevo-alumno').addEventListener('click', async () => { 
            document.getElementById('modal-alumno-titulo').textContent = 'Datos del Alumno';
            document.getElementById('alumno-id').value = '';
            document.getElementById('form-alumno').reset();
            quill.setContents([]);
            
            // Limpiar UI Disponibilidad
            diasSemana.forEach(dia => {
                document.getElementById(`disp-${dia.id}-all`).checked = false;
                document.getElementById(`disp-${dia.id}-none`).checked = false;
                document.getElementById(`disp-${dia.id}-inicio`).disabled = false;
                document.getElementById(`disp-${dia.id}-fin`).disabled = false;
                document.getElementById(`estado-${dia.id}`).textContent = "";
            });

            await cargarSelectsFormulario(); 
            document.getElementById('modal-alumno').showModal(); 
        });
        
        document.getElementById('btn-cerrar-alumno').addEventListener('click', () => document.getElementById('modal-alumno').close());
        document.getElementById('btn-cerrar-agenda').addEventListener('click', () => document.getElementById('modal-agenda').close());

        document.getElementById('form-alumno').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const objDisponibilidad = {};
            diasSemana.forEach(dia => {
                const chkAll = document.getElementById(`disp-${dia.id}-all`).checked;
                const chkNone = document.getElementById(`disp-${dia.id}-none`).checked;
                let ini = document.getElementById(`disp-${dia.id}-inicio`).value;
                let fin = document.getElementById(`disp-${dia.id}-fin`).value;

                if (chkNone) {
                    objDisponibilidad[dia.id] = [];
                } else if (chkAll) {
                    objDisponibilidad[dia.id] = [{ inicio: '09:00', fin: '22:00' }];
                } else {
                    if (ini || fin) {
                        if (ini && !fin) fin = '22:00';
                        if (!ini && fin) ini = '09:00';
                        objDisponibilidad[dia.id] = [{ inicio: ini, fin: fin }];
                    } else {
                        objDisponibilidad[dia.id] = [];
                    }
                }
            });

            const dataAlumno = {
                nombre: document.getElementById('nombre').value,
                celular: document.getElementById('celular').value,
                edad: Number(document.getElementById('edad').value),
                instrumento: document.getElementById('instrumento').value,
                tipo_suscripcion: document.getElementById('tipo_suscripcion').value,
                descripcion: quill.root.innerHTML,
                estado_agenda: document.getElementById('alumno-id').value ? undefined : "Gestión en curso", // No sobreescribir si edita
                disponibilidad: objDisponibilidad
            };

            try {
                const idEdicion = document.getElementById('alumno-id').value;
                if (idEdicion) {
                    delete dataAlumno.estado_agenda; // Evita blanquear estado actual
                    await updateDoc(doc(db, "alumnos", idEdicion), dataAlumno);
                } else {
                    await addDoc(collection(db, "alumnos"), dataAlumno);
                }
                document.getElementById('modal-alumno').close(); 
                cargarVista(estadoActualVista); 
            } catch (error) { alert("Error al guardar."); }
        });

        // --- ACCIONES DE RESERVA ---
        document.getElementById('resultados-agenda').addEventListener('click', async (e) => {
            if (!alumnoIdActual) return;
            const docRef = doc(db, "alumnos", alumnoIdActual);
            try {
                if (e.target.classList.contains('btn-validar-profe')) {
                    await navigator.clipboard.writeText(`Hola, ¿podés tomar una clase de admisión el ${e.target.getAttribute('data-hora')}?`);
                    await updateDoc(docRef, { estado_agenda: "Validación con profe" });
                    document.getElementById('modal-agenda').close(); cargarVista(estadoActualVista);
                }
                if (e.target.classList.contains('btn-validar-alumno')) {
                    await navigator.clipboard.writeText(`Hola, tenemos disponibilidad para tu clase de prueba el ${e.target.getAttribute('data-hora')}. ¿Te sirve este horario?`);
                    await updateDoc(docRef, { estado_agenda: "Se ofrece agenda" });
                    document.getElementById('modal-agenda').close(); cargarVista(estadoActualVista);
                }
                if (e.target.classList.contains('btn-reservar')) {
                    const alDoc = await getDoc(docRef);
                    const titulo = `RESERVA - ${alDoc.data().nombre} (${alDoc.data().instrumento})`;
                    const evObj = await crearEventoCalendario(e.target.getAttribute('data-calid'), titulo, e.target.getAttribute('data-start'), e.target.getAttribute('data-end'));
                    await updateDoc(docRef, { id_evento_reserva: evObj.id, id_calendario_usado: e.target.getAttribute('data-calid'), estado_agenda: "Se ofrece agenda" });
                    alert("Reserva registrada.");
                    document.getElementById('modal-agenda').close(); cargarVista(estadoActualVista);
                }
            } catch (error) { alert("Error al ejecutar acción."); }
        });
    </script>
</body>
</html>
